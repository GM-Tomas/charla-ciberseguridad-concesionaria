<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 44" width="176" height="44" role="img" aria-label="Pulso!">
  <!-- Geometric quiz-inspired badge -->
  <rect x="2" y="4" width="36" height="36" rx="10" fill="#46178f" />
  <polygon points="14,12 19,20 9,20" fill="#e21b3c" />
  <rect x="22" y="12" width="8" height="8" rx="1.5" transform="rotate(45 26 16)" fill="#1368ce" />
  <circle cx="14" cy="29" r="4.2" fill="#d89e00" />
  <rect x="22" y="25" width="8" height="8" rx="1.5" fill="#26890c" />

  <!-- Bold playful royal-purple wordmark -->
  <text
    x="48"
    y="32"
    fill="#46178f"
    font-family="'Montserrat', 'Nunito', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="29"
    font-weight="900"
    letter-spacing="-0.8"
  >Pulso</text>

  <!-- Tilted energetic exclamation mark -->
  <g transform="translate(133, 22) rotate(10)">
    <rect x="-3.4" y="-15" width="6.8" height="19" rx="3.4" fill="#46178f" />
    <circle cx="0" cy="9.5" r="3.8" fill="#46178f" />
  </g>
</svg>
